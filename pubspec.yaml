name: queueflow_mobile
description: "A new Flutter project."

publish_to: "none"

version: 1.0.12+13

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  mobile_scanner: ^7.2.0
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  # Poppins: the rounded, friendly sans used across delivery and wallet apps
  # (SIL Open Font License, assets/fonts/Poppins-OFL.txt). Bundled, not
  # downloaded, so text looks right on a slow connection too.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
